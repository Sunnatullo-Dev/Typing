services:
  - type: web
    name: typing-app
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn typing_site.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: typing-champion.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://typing-champion.onrender.com
      - key: DB_DIR
        value: /opt/render/project/src/data
      - key: MEDIA_ROOT
        value: /opt/render/project/src/data/media
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    postDeployCommand: python manage.py migrate && python seed_lessons.py
